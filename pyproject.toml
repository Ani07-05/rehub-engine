[project]
name = "rehub"
version = "0.2.0"
description = "Local, offline OT investigation engine: correlates Zeek, Suricata, tshark and PLC logic evidence"
authors = [
    { name = "Anirudh", email = "anirudh.ashrith2005@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "scapy>=2.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
