name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ani07-05/rehub-engine

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Installer syntax
        run: sh -n scripts/install.sh && docker compose -f compose.yml config -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: rehub:ci
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
      - name: Doctor inside the image
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p data && chmod 777 data
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v "$PWD/data:/data" rehub:ci rehub --data /data doctor
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.tag }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags="-t ${IMAGE}:latest -t ${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="$tags -t ${IMAGE}:${GITHUB_REF_NAME}"; fi
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)
      - name: Show the result
        run: docker buildx imagetools inspect "${IMAGE}:latest"

  stack:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: rehub:ci
          cache-from: type=gha,scope=amd64
      - name: Install and check the compose stack
        run: |
          REHUB_IMAGE=rehub:ci ./scripts/install.sh --no-open --port 18080
          curl -fsS http://localhost:18080/api/health
          ! docker compose -p rehub exec -T engine python3 -c "import urllib.request; urllib.request.urlopen('http://1.1.1.1', timeout=3)"
          ./scripts/install.sh --uninstall --purge
